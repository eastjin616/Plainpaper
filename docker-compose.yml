services:
  frontend:
    build:
      context: .
    container_name: plainpaper-frontend
    ports:
      - "3001:3000"
    depends_on:
      - backend

  backend:
    build:
      context: ../plainpaper_back
    container_name: plainpaper-backend
    ports:
      - "8000:8000"
    depends_on:
      - db
    env_file:
      - ../plainpaper_back/.env

  db:
    image: postgres:15
    container_name: plainpaper-db
    environment:
      POSTGRES_USER: plainpaper
      POSTGRES_PASSWORD: plainpaper
      POSTGRES_DB: plainpaper
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
